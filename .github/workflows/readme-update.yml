name: Update README.md when files change

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'index.md'
      - '.github/**'
      - '_layouts/**'
      - 'assets/**'
      - '_utils/**'

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Update README.md
        run: ./_utils/indexer.sh > README.md

      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date"
            exit 0
          fi

          git config user.email "milsom@gmail.com"
          git config user.name "Dave Milsom"
          git add README.md
          git commit -m "Update README"
          git push